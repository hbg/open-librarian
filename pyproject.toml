[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openlibrarian"
version = "0.1.0"
description = "MCP-native document retrieval service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "OpenLibrarian Contributors" }]
dependencies = [
    "typer>=0.9,<1",
    "rich>=13,<14",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "docling>=2,<3",
    "lancedb>=0.4,<1",
    "pyarrow>=14,<20",
    "openai>=1,<2",
    "boto3>=1.34,<2",
    "mcp>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
openlibrarian = "openlibrarian.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openlibrarian"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
